<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Manaus Totem - Admin</title>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;

  font-family:
    Arial,sans-serif;

  background:#f2f2f2;

  color:#222;
}

.layout{
  display:flex;

  height:100vh;

  overflow:hidden;
}

.sidebar{

  width:320px;

  background:#151515;

  color:#fff;

  padding:18px;

  overflow:auto;
}

.sidebar h2{
  margin-top:0;
}

.status{

  font-size:13px;

  margin-bottom:15px;
}

.dot{

  display:inline-block;

  width:10px;
  height:10px;

  border-radius:50%;

  background:#d00;

  margin-right:6px;
}

.dot.online{
  background:#19c719;
}

.totem-item{

  padding:12px;

  border-radius:8px;

  background:#242424;

  margin-bottom:8px;

  cursor:pointer;
}

.totem-item.selected{

  outline:
    2px solid #fff;
}

.totem-item small{

  display:block;

  color:#bbb;

  margin-top:5px;
}

.main{

  flex:1;

  padding:25px;

  overflow:auto;
}

.card{

  background:#fff;

  border-radius:10px;

  padding:20px;

  max-width:850px;
}

label{

  display:block;

  font-weight:bold;

  margin:
    15px 0 6px;
}

input,
textarea,
select{

  width:100%;

  padding:10px;

  border:
    1px solid #ccc;

  border-radius:6px;

  font-size:15px;
}

textarea{

  min-height:130px;

  resize:vertical;
}

button{

  padding:
    10px 16px;

  border:0;

  border-radius:6px;

  cursor:pointer;

  margin:
    8px 6px 0 0;
}

.save{

  background:#1683ff;

  color:#fff;
}

.delete{

  background:#d33;

  color:#fff;
}

.row{

  display:flex;

  gap:10px;

  flex-wrap:wrap;
}

.sound-box{

  display:flex;

  align-items:center;

  gap:10px;

  margin-top:8px;
}

.sound-box input{

  width:auto;
}

.offline-note{

  margin-top:10px;

  padding:10px;

  border-radius:6px;

  background:#f4f4f4;

  font-size:13px;

  color:#555;
}

</style>

</head>

<body>

<div class="layout">


<aside class="sidebar">

<h2>Manaus Totem</h2>


<div class="status">

<span
  id="statusDot"
  class="dot">
</span>

<span id="statusText">
Desconectado
</span>

</div>


<div id="totemList"></div>

</aside>


<main class="main">

<div class="card">

<h2>
Configuração do Totem
</h2>


<p id="selectedInfo">
Selecione um totem.
</p>


<label>
Nome / Loja
</label>

<input id="name">


<label>
Tipo de mídia
</label>

<select id="mediaType">

<option value="image">
Imagem
</option>

<option value="video">
Vídeo
</option>

<option value="mixed">
Misto — imagem + vídeo
</option>

<option value="iframe">
Iframe
</option>

</select>


<label>
URLs da playlist
</label>

<textarea
  id="mediaUrl"
  placeholder="Uma URL por linha">
</textarea>


<label>
Texto do letreiro
</label>

<input id="tickerText">


<label>
Ícone do letreiro (URL)
</label>

<input id="tickerIcon">


<label>
Orientação
</label>

<select id="orientation">

<option value="portrait">
Retrato
</option>

<option value="landscape">
Paisagem
</option>

</select>


<label>
Som
</label>


<div class="sound-box">

<input
  type="checkbox"
  id="soundEnabled">

<span>
Permitir som nos vídeos
</span>

</div>


<div class="offline-note">
As alterações ficam salvas no banco mesmo
quando o totem estiver offline. Quando ele
for ligado novamente, receberá a configuração.
</div>


<div class="row">

<button
  class="save"
  id="saveName">
Salvar nome
</button>


<button
  class="save"
  id="saveMedia">
Salvar mídia
</button>


<button
  class="save"
  id="saveTicker">
Salvar letreiro
</button>


<button
  class="save"
  id="saveOrientation">
Salvar orientação
</button>


<button
  class="save"
  id="saveSound">
Salvar som
</button>


<button
  class="delete"
  id="deleteTotem">
Excluir totem
</button>

</div>

</div>

</main>

</div>


<script>

const SERVER_URL =
  "wss://manaustotem.onrender.com";


let socket = null;

let reconnectTimer = null;

let totems = {};

let selectedTotemId = null;


const statusDot =
  document.getElementById(
    "statusDot"
  );


const statusText =
  document.getElementById(
    "statusText"
  );


const list =
  document.getElementById(
    "totemList"
  );


function setStatus(
  online
){

  statusDot.classList.toggle(
    "online",
    online
  );


  statusText.textContent =
    online
      ? "Conectado"
      : "Desconectado";
}


function connect(){

  if(
    socket &&
    (
      socket.readyState ===
        WebSocket.OPEN ||
      socket.readyState ===
        WebSocket.CONNECTING
    )
  ){

    return;
  }


  socket =
    new WebSocket(
      SERVER_URL
    );


  socket.onopen =
    ()=>{

      setStatus(true);


      socket.send(
        JSON.stringify({

          type:
            "register_admin"
        })
      );
    };


  socket.onmessage =
    event=>{

      try{

        const data =
          JSON.parse(
            event.data
          );


        if(
          data.type ===
          "totem_list"
        ){

          totems =
            data.totems || {};


          renderList();


          /*
           * Se o totem estiver offline,
           * continua selecionado e
           * continua editável.
           */

          if(
            selectedTotemId &&
            totems[
              selectedTotemId
            ]
          ){

            populateForm(
              totems[
                selectedTotemId
              ]
            );
          }
        }


      }catch(e){}
    };


  socket.onclose =
    ()=>{

      setStatus(false);

      scheduleReconnect();
    };


  socket.onerror =
    ()=>{

      setStatus(false);


      try{

        socket.close();

      }catch(e){}
    };
}


function scheduleReconnect(){

  if(
    reconnectTimer
  ){

    return;
  }


  reconnectTimer =
    setTimeout(
      ()=>{

        reconnectTimer =
          null;

        connect();

      },
      3000
    );
}


function renderList(){

  list.innerHTML = "";


  const items =
    Object.values(
      totems
    );


  if(
    !items.length
  ){

    list.innerHTML =
      "<small>Nenhum totem cadastrado ainda.</small>";

    return;
  }


  items.forEach(
    t=>{

      const item =
        document.createElement(
          "div"
        );


      item.className =
        "totem-item" +
        (
          t.id ===
          selectedTotemId
            ? " selected"
            : ""
        );


      item.innerHTML = `

        <strong>
          ${escapeHtml(
            t.name ||
            t.storeName ||
            t.id
          )}
        </strong>

        <small>
          ${
            t.online
              ? "● Online"
              : "○ Offline"
          }
        </small>

        <small>
          ID: ${escapeHtml(t.id)}
        </small>

      `;


      item.onclick =
        ()=>{

          selectedTotemId =
            t.id;


          renderList();


          populateForm(t);
        };


      list.appendChild(
        item
      );
    }
  );
}


function populateForm(
  t
){

  document.getElementById(
    "selectedInfo"
  ).textContent =
    `${t.id} — ${
      t.online
        ? "Online"
        : "Offline"
    }`;


  document.getElementById(
    "name"
  ).value =
    t.name ||
    t.storeName ||
    "";


  document.getElementById(
    "mediaType"
  ).value =
    t.mediaType ||
    "image";


  document.getElementById(
    "mediaUrl"
  ).value =
    t.mediaUrl ||
    "";


  document.getElementById(
    "tickerText"
  ).value =
    t.tickerText ||
    "";


  document.getElementById(
    "tickerIcon"
  ).value =
    t.tickerIcon ||
    "";


  document.getElementById(
    "orientation"
  ).value =
    t.orientation ||
    "portrait";


  document.getElementById(
    "soundEnabled"
  ).checked =
    t.soundEnabled === true;
}


function sendCommand(
  payload
){

  if(
    !selectedTotemId
  ){

    alert(
      "Selecione um totem."
    );

    return;
  }


  if(
    !socket ||
    socket.readyState !==
      WebSocket.OPEN
  ){

    alert(
      "Admin está desconectado."
    );

    return;
  }


  socket.send(
    JSON.stringify({

      type:
        "totem_command",

      totemId:
        selectedTotemId,

      ...payload

    })
  );
}


/*
 * NOME
 */

document.getElementById(
  "saveName"
).onclick =
  ()=>{

    sendCommand({

      name:
        document.getElementById(
          "name"
        ).value

    });
  };


/*
 * MÍDIA
 */

document.getElementById(
  "saveMedia"
).onclick =
  ()=>{

    sendCommand({

      mediaType:
        document.getElementById(
          "mediaType"
        ).value,

      mediaUrl:
        document.getElementById(
          "mediaUrl"
        ).value

    });
  };


/*
 * LETREIRO
 */

document.getElementById(
  "saveTicker"
).onclick =
  ()=>{

    sendCommand({

      tickerText:
        document.getElementById(
          "tickerText"
        ).value,

      tickerIcon:
        document.getElementById(
          "tickerIcon"
        ).value

    });
  };


/*
 * ORIENTAÇÃO
 */

document.getElementById(
  "saveOrientation"
).onclick =
  ()=>{

    sendCommand({

      orientation:
        document.getElementById(
          "orientation"
        ).value

    });
  };


/*
 * SOM
 */

document.getElementById(
  "saveSound"
).onclick =
  ()=>{

    sendCommand({

      soundEnabled:
        document.getElementById(
          "soundEnabled"
        ).checked

    });
  };


/*
 * EXCLUIR
 */

document.getElementById(
  "deleteTotem"
).onclick =
  ()=>{

    if(
      !selectedTotemId
    ){

      return;
    }


    if(
      !confirm(
        "Excluir este totem?"
      )
    ){

      return;
    }


    socket.send(
      JSON.stringify({

        type:
          "delete_totem",

        totemId:
          selectedTotemId

      })
    );


    selectedTotemId =
      null;


    document.getElementById(
      "selectedInfo"
    ).textContent =
      "Selecione um totem.";
  };


function escapeHtml(
  value
){

  return String(value)

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );
}


connect();

</script>

</body>

</html>
