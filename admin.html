<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Manaus Totem - Admin</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f2f2f2;color:#222}.layout{display:flex;height:100vh;overflow:hidden}.sidebar{width:320px;background:#151515;color:#fff;padding:18px;overflow:auto}.main{flex:1;padding:25px;overflow:auto}.card{background:#fff;border-radius:10px;padding:20px;max-width:850px}label{display:block;font-weight:bold;margin:15px 0 6px}input,textarea,select{width:100%;padding:10px;border:1px solid #ccc;border-radius:6px;font-size:15px}textarea{min-height:130px}button{padding:10px 16px;border:0;border-radius:6px;cursor:pointer;margin:8px 6px 0 0}.save{background:#1683ff;color:white}.delete{background:#d33;color:white}.item{padding:12px;border-radius:8px;background:#242424;margin-bottom:8px;cursor:pointer}.selected{outline:2px solid white}.item small{display:block;color:#bbb;margin-top:5px}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#d00}.on{background:#19c719}</style></head>
<body><div class="layout"><aside class="sidebar"><h2>Manaus Totem</h2><p><span id="dot" class="dot"></span> <span id="status">Desconectado</span></p><div id="list"></div></aside><main class="main"><div class="card"><h2>Configuração do Totem</h2><p id="info">Selecione um totem.</p><label>Nome / Loja</label><input id="name"><label>Tipo de mídia</label><select id="type"><option value="image">Imagem</option><option value="video">Vídeo</option><option value="mixed">Misto (Imagem + Vídeo)</option></select><label>URLs da playlist</label><textarea id="urls" placeholder="Uma URL por linha"></textarea><label>Texto do letreiro</label><input id="ticker"><label>Ícone do letreiro (URL)</label><input id="icon"><label>Orientação</label><select id="orientation"><option value="portrait">Retrato</option><option value="landscape">Paisagem</option></select><label><input type="checkbox" id="audio" style="width:auto"> Permitir áudio dos vídeos</label><button class="save" onclick="save()">Salvar configuração</button><button class="delete" onclick="removeTotem()">Excluir totem</button></div></main></div>
<script>
const SERVER="wss://manaustotem.onrender.com";let socket,totems={},selected=null,reconnect;
const $=id=>document.getElementById(id);
function status(v){$("dot").classList.toggle("on",v);$("status").textContent=v?"Conectado":"Desconectado"}
function connect(){if(socket&&(socket.readyState===0||socket.readyState===1))return;socket=new WebSocket(SERVER);socket.onopen=()=>{status(true);socket.send(JSON.stringify({type:"register_admin"}))};socket.onmessage=e=>{try{let d=JSON.parse(e.data);if(d.type==="totem_list"){totems=d.totems||{};render();if(selected&&totems[selected])fill(totems[selected])}}catch{}};socket.onclose=()=>{status(false);if(!reconnect)reconnect=setTimeout(()=>{reconnect=null;connect()},3000)};socket.onerror=()=>{try{socket.close()}catch{}}}
function render(){$("list").innerHTML="";Object.values(totems).forEach(t=>{let el=document.createElement("div");el.className="item"+(t.id===selected?" selected":"");el.innerHTML="<strong>"+esc(t.name||t.storeName||t.id)+"</strong><small>"+(t.online?"● Online":"○ Offline")+"</small>";el.onclick=()=>{selected=t.id;render();fill(t)};$("list").appendChild(el)})}
function fill(t){$("info").textContent=t.id+" — "+(t.online?"Online":"Offline");$("name").value=t.name||t.storeName||"";$("type").value=t.mediaType||"image";$("urls").value=t.mediaUrl||"";$("ticker").value=t.tickerText||"";$("icon").value=t.tickerIcon||"";$("orientation").value=t.orientation||"portrait";$("audio").checked=t.audioEnabled===true}
function send(data){if(!selected)return alert("Selecione um totem.");if(!socket||socket.readyState!==1)return alert("Admin desconectado.");socket.send(JSON.stringify({type:"totem_command",totemId:selected,...data}))}
function save(){send({name:$("name").value,mediaType:$("type").value,mediaUrl:$("urls").value,tickerText:$("ticker").value,tickerIcon:$("icon").value,orientation:$("orientation").value,audioEnabled:$("audio").checked})}
function removeTotem(){if(!selected||!confirm("Excluir este totem?"))return;socket.send(JSON.stringify({type:"delete_totem",totemId:selected}));selected=null}
function esc(v){return String(v).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
connect();
</script></body></html>
