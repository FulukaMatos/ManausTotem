<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Manaus Totem</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}#app{position:absolute;left:50%;top:50%;width:100vw;height:100vh;transform:translate(-50%,-50%);background:#000;overflow:hidden}#media{position:absolute;inset:0 0 60px;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#000}#media img{width:100%;height:100%;object-fit:contain}video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .18s}video.active{opacity:1;visibility:visible}#ticker{position:absolute;bottom:0;left:0;right:0;height:60px;display:flex;align-items:center;justify-content:center;gap:10px;padding:0 20px;background:#000e;color:#fff;font:24px Arial;white-space:nowrap;overflow:hidden;z-index:20}#icon{max-width:34px;max-height:34px}#connection{position:absolute;top:12px;right:12px;width:14px;height:14px;border-radius:50%;background:#d00;z-index:50}.online{background:#19c719!important}.landscape{width:100vw!important;height:100vh!important;transform:translate(-50%,-50%)!important}@media(min-width:768px) and (orientation:landscape){#app{width:100vh;height:100vw;transform:translate(-50%,-50%) rotate(-90deg)}}
</style></head><body><div id="app"><div id="connection"></div><div id="media"><img id="image" style="display:none"><video id="a" playsinline preload="auto"></video><video id="b" playsinline preload="auto"></video></div><div id="ticker"><img id="icon" style="display:none"><span id="text">Bem-vindo!</span></div></div>
<script>
const SERVER="wss://manaustotem.onrender.com",app=document.getElementById("app"),conn=document.getElementById("connection"),image=document.getElementById("image"),a=document.getElementById("a"),b=document.getElementById("b"),text=document.getElementById("text"),icon=document.getElementById("icon");
let socket,reconnect,config={orientation:"portrait",mediaType:"image",mediaUrl:"",tickerText:"Bem-vindo!",tickerIcon:"",audioEnabled:false},items=[],index=0,generation=0,timer;
let id=localStorage.getItem("manaus_totem_id")||("totem_"+Math.random().toString(36).slice(2,11));localStorage.setItem("manaus_totem_id",id);
const key="totem_config_"+id;
function online(v){conn.classList.toggle("online",v)}
function urls(){return String(config.mediaUrl||"").split(/[\n,]+/).map(x=>x.trim()).filter(Boolean)}
function isVideo(u){return /\.(mp4|webm|ogg)(\?|#|$)/i.test(u)||/video/i.test(u)}
function reset(){clearTimeout(timer);timer=null;image.style.display="none";[a,b].forEach(v=>{v.pause();v.removeAttribute("src");v.load();v.classList.remove("active");v.onended=null;v.onerror=null})}
function setOrientation(v){app.classList.toggle("landscape",v==="landscape")}
function showImage(i,g){if(g!==generation)return;reset();image.style.display="block";image.src=items[i];timer=setTimeout(()=>{index=(index+1)%items.length;showNext(g)},10000)}
function showNext(g){if(g!==generation||!items.length)return;let u=items[index];if(isVideo(u))playVideo(u,g);else showImage(index,g)}
function playVideo(u,g){
 let v=(playVideo.last===a)?b:a;playVideo.last=v;resetVideo(v);v.src=u;v.muted=!config.audioEnabled;v.volume=1;v.classList.add("active");
 v.onended=()=>{if(g!==generation)return;index=(index+1)%items.length;showNext(g)};
 v.onerror=()=>{if(g!==generation)return;index=(index+1)%items.length;setTimeout(()=>showNext(g),300)};
 v.play().catch(()=>setTimeout(()=>v.play().catch(()=>{}),400));
}
function resetVideo(v){v.pause();v.classList.remove("active");v.onended=null;v.onerror=null}
function apply(data,save=true){
 if(!data)return;Object.assign(config,data);setOrientation(config.orientation);text.textContent=config.tickerText||"";
 if(config.tickerIcon){icon.src=config.tickerIcon;icon.style.display="block"}else icon.style.display="none";
 items=urls();index=0;generation++;let g=generation;reset();
 if(!items.length){return}
 if(config.mediaType==="mixed"){showNext(g)}
 else if(config.mediaType==="video"){showVideoPlaylist(g)}
 else{showImage(0,g)}
 if(save)localStorage.setItem(key,JSON.stringify(config))
}
function showVideoPlaylist(g){if(!items.length)return;playVideo.last=b;playVideo(items[index],g)}
function connect(){
 if(socket&&(socket.readyState===0||socket.readyState===1))return;
 socket=new WebSocket(SERVER);
 socket.onopen=()=>{online(true);socket.send(JSON.stringify({type:"register_totem",totemId:id,name:localStorage.getItem("totem_name")||"",storeName:localStorage.getItem("totem_store")||""}))};
 socket.onmessage=e=>{try{let d=JSON.parse(e.data);if(d.type==="totem_state"){apply(d);if(d.name!==undefined)localStorage.setItem("totem_name",d.name);if(d.storeName!==undefined)localStorage.setItem("totem_store",d.storeName)}}catch{}};
 socket.onclose=()=>{online(false);if(!reconnect)reconnect=setTimeout(()=>{reconnect=null;connect()},5000)};
 socket.onerror=()=>{online(false);try{socket.close()}catch{}};
}
addEventListener("DOMContentLoaded",()=>{try{let s=localStorage.getItem(key);if(s)apply(JSON.parse(s),false)}catch{}connect()});
document.addEventListener("contextmenu",e=>e.preventDefault());
</script></body></html>
